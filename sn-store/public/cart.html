<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Cart · SN Store</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <a href="index.html" class="logo">SN<span class="dot">.</span>Store</a>
    <div class="header-search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" placeholder="Search products..." onkeydown="if(event.key==='Enter'){window.location.href='index.html'}">
    </div>
    <div class="header-actions">
      <button class="cart-btn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
        Cart <span class="cart-count">0</span>
      </button>
    </div>
  </div>
</header>

<h1 class="page-title">Your Cart</h1>

<div class="cart-page-layout">
  <div class="cart-page-list"></div>

  <div class="order-summary-card">
    <h3>Order Summary</h3>
    <div class="summary-row"><span>Subtotal</span><span class="sum-subtotal">₹0</span></div>
    <div class="summary-row"><span>Shipping</span><span class="sum-shipping">Free</span></div>
    <div class="summary-row"><span>Tax (5%)</span><span class="sum-tax">₹0</span></div>
    <div class="summary-row total"><span>Total</span><span class="sum-total">₹0</span></div>

    <form class="checkout-form">
      <div class="form-row">
        <label for="name">Full Name</label>
        <input type="text" id="name" name="name" required placeholder="Aarav Sharma">
      </div>
      <div class="form-row">
        <label for="phone">Phone Number</label>
        <input type="tel" id="phone" name="phone" required pattern="[0-9]{10}" placeholder="9876543210">
      </div>
      <div class="form-row">
        <label for="address">Delivery Address</label>
        <textarea id="address" name="address" rows="2" required placeholder="House no., street, locality"></textarea>
      </div>
      <div class="form-grid-2">
        <div class="form-row">
          <label for="city">City</label>
          <input type="text" id="city" name="city" required placeholder="New Delhi">
        </div>
        <div class="form-row">
          <label for="pincode">Pincode</label>
          <input type="text" id="pincode" name="pincode" required pattern="[0-9]{6}" placeholder="110001">
        </div>
      </div>
      <div class="form-error"></div>
      <button type="submit" class="checkout-btn">Place Order</button>
    </form>
  </div>
</div>

<div class="cart-page-empty empty-state" style="display:none;">
  <h2>Your cart is empty</h2>
  <p>Looks like you haven't added anything yet.</p>
  <a href="index.html">Continue Shopping &rarr;</a>
</div>

<footer class="site-footer">
  <p><strong>SN Store</strong> — quality goods, fair prices. &copy; 2026 SN Store. All rights reserved.</p>
</footer>

<script src="js/cart.js"></script>
<script src="js/checkout.js"></script>
</body>
</html>
