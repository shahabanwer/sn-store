<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order Confirmed · SN Store</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <a href="index.html" class="logo">SN<span class="dot">.</span>Store</a>
    <div style="flex:1"></div>
    <div class="header-actions">
      <button class="cart-btn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
        Cart <span class="cart-count">0</span>
      </button>
    </div>
  </div>
</header>

<div class="success-wrap">
  <div class="success-icon">&#10003;</div>
  <h1>Order placed successfully!</h1>
  <p>Thanks for shopping with SN Store. A confirmation has been recorded against your order below. Expected delivery by <strong class="order-eta">—</strong>.</p>

  <div class="order-id-box">Loading order details...</div>

  <a href="index.html" class="hero-cta">Continue Shopping &rarr;</a>
</div>

<footer class="site-footer">
  <p><strong>SN Store</strong> — quality goods, fair prices. &copy; 2026 SN Store. All rights reserved.</p>
</footer>

<script src="js/cart.js"></script>
<script src="js/order-success.js"></script>
</body>
</html>
