<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product · SN Store</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <a href="index.html" class="logo">SN<span class="dot">.</span>Store</a>
    <div class="header-search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" id="search-input" placeholder="Search products..." onkeydown="if(event.key==='Enter'){window.location.href='index.html'}">
    </div>
    <div class="header-actions">
      <button class="cart-btn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
        Cart <span class="cart-count">0</span>
      </button>
    </div>
  </div>
</header>

<div class="breadcrumb">
  <a href="index.html">Home</a> / <span id="breadcrumb-name">Product</span>
</div>

<div class="pd-layout">
  <div class="pd-image"><img src="" alt=""></div>

  <div class="pd-details">
    <div class="pd-category"></div>
    <h1 class="pd-name"></h1>
    <div class="pd-rating"></div>

    <div class="pd-price-row">
      <span class="pd-price"></span>
      <span class="pd-mrp"></span>
      <span class="pd-discount"></span>
    </div>
    <div class="pd-tax-note">Inclusive of all taxes</div>

    <p class="pd-tagline"></p>
    <p class="pd-desc"></p>

    <div class="pd-qty-row">
      <div class="pd-qty-controls">
        <button class="qty-minus" aria-label="Decrease quantity">&minus;</button>
        <span class="qty-value">1</span>
        <button class="qty-plus" aria-label="Increase quantity">+</button>
      </div>
      <span class="stock-note">In stock</span>
    </div>

    <div class="pd-actions">
      <button class="btn-primary btn-add">Add to Cart</button>
      <button class="btn-secondary btn-buy">Buy Now</button>
    </div>

    <div class="pd-specs">
      <h3>Product Details</h3>
      <ul></ul>
    </div>
  </div>
</div>

<footer class="site-footer">
  <p><strong>SN Store</strong> — quality goods, fair prices. &copy; 2026 SN Store. All rights reserved.</p>
</footer>

<script src="js/cart.js"></script>
<script src="js/product.js"></script>
</body>
</html>
